[tools]
python = "3.11"
uv = "latest"

[tasks.bootstrap]
description = "Install native Linux dependencies for the current distro"
run = '''
set -eu
. /etc/os-release
case "${ID:-}" in
  ubuntu|debian)
    mise run bootstrap-ubuntu
    ;;
  fedora)
    mise run bootstrap-fedora
    ;;
  *)
    echo "Unsupported distro ID: ${ID:-unknown}. Use docs/BLUETOOTH_ROUTE_GUIDANCE_PROBE.md for package requirements." >&2
    exit 1
    ;;
esac
'''

[tasks.bootstrap-ubuntu]
description = "Install Ubuntu/Debian system packages required to build/use the Bluetooth probe"
run = '''
set -eu
sudo apt-get update
sudo apt-get install -y \
  bluez \
  build-essential \
  pkg-config \
  libcairo2-dev \
  libdbus-1-dev \
  libglib2.0-dev \
  libgirepository1.0-dev \
  libffi-dev
'''

[tasks.bootstrap-fedora]
description = "Install Fedora system packages required to build/use the Bluetooth probe"
run = '''
set -eu
sudo dnf install -y \
  gcc gcc-c++ \
  pkgconf-pkg-config \
  cairo-devel \
  glib2-devel \
  gobject-introspection-devel \
  libffi-devel \
  dbus-devel \
  bluez bluez-tools
'''

[tasks.setup]
description = "Create/sync the uv virtualenv and install development dependencies"
run = "uv sync"

[tasks.setup-full]
description = "Install dependencies used by the wider original example code"
run = "uv sync --extra full"

[tasks.prepare-adapter]
description = "Prepare the selected Bluetooth adapter for head-unit style discovery"
run = '''
set -eu
adapter="${IAP2_ADAPTER:-hci0}"
if ! command -v hciconfig >/dev/null 2>&1; then
  echo "hciconfig is required for this experiment (normally provided by the bluez package)." >&2
  exit 1
fi
echo "Preparing $adapter"
sudo hciconfig "$adapter" up
sudo hciconfig "$adapter" class 0x7a020c
sudo hciconfig "$adapter" piscan
hciconfig "$adapter"
'''

[tasks.prepare-adapter-eir]
description = "EXPERIMENTAL: apply the original project's captured iAP2/CarPlay inquiry data"
run = '''
set -eu
adapter="${IAP2_ADAPTER:-hci0}"
inqdata="0e0972617370626572727970693031020a00091002006b1d460237051107FFCACADEAFDECADEDEFACADE000000000d0950455547454f2d3633383400110600000000DECAFADEDECADEAFDECACAFF1107D31FBF505D572797A24041CD484388EC"
echo "Applying captured experimental inquiry data to $adapter"
echo "NOTE: this blob comes from the original project and contains captured identity data; use only for protocol testing."
sudo hciconfig "$adapter" inqdata "$inqdata"
hciconfig "$adapter" inqdata
'''

[tasks.doctor]
description = "Check the Bluetooth-route-guidance Python environment and host tools"
run = '''
set -eu
uv run python - <<'PY'
import sys
import dbus
from gi.repository import GLib
import smbus2
print(f"python: {sys.version.split()[0]}")
print("python imports: dbus, gi/GLib, smbus2: ok")
PY
for cmd in bluetoothctl btmon hciconfig; do
  if command -v "$cmd" >/dev/null 2>&1; then
    echo "$cmd: $(command -v "$cmd")"
  else
    echo "$cmd: MISSING (install BlueZ tools)" >&2
  fi
done
'''

[tasks.probe]
description = "Run the Bluetooth-only iAP2 Route Guidance probe"
depends = ["setup"]
run = "uv run python example/route_guidance_probe.py"

[tasks.test]
description = "Run Python tests"
depends = ["setup"]
run = "uv run pytest"
